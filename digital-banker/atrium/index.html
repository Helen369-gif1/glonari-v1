<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b1a0c">
<title>Glonari — Digital Banker Atrium</title>
<!-- Dark entry veil from digital-banker/gia/index.html (#exit-veil there):
     same color on both sides of the hand-off, and the same color as this
     page's own #veil (#1c1005), so arriving here reads as one short dip to
     dark. Inline here, not a linked stylesheet or a JS-added class, so the
     very first paint is already fully opaque while the panorama, fonts and
     WebGL scene are prepared underneath. Faded out by the control script at
     the end of <body> once atrium.js marks the scene ready (body.ready). -->
<style>
  #gia-entry-veil { position: fixed; inset: 0; z-index: 2000; opacity: 1; pointer-events: none; background: #1c1005; }
  /* While the veil covers the page, the canvas appears at once instead of
     through its own 1.2s fade from the walnut background, so the veil
     lifts straight onto the finished hall (see the control script). */
  html.gia-entry #stage canvas { transition: filter .5s ease; }
</style>
<script>document.documentElement.classList.add('gia-entry');</script>
<style>
  @font-face { font-family: Cinzel; font-weight: 600; font-display: swap; src: url('assets/fonts/cinzel-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Cormorant Garamond'; font-weight: 400; font-display: swap; src: url('assets/fonts/cormorant-garamond-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Cormorant Garamond'; font-weight: 400; font-style: italic; font-display: swap; src: url('assets/fonts/cormorant-garamond-latin-400-italic.woff2') format('woff2'); }
  @font-face { font-family: 'Cormorant Garamond'; font-weight: 500; font-display: swap; src: url('assets/fonts/cormorant-garamond-latin-500-normal.woff2') format('woff2'); }

  :root {
    --walnut: #2b1a0c;
    --stone: #efdfbf;
    --gilt: #d8b067;
    --gilt-deep: #9a6d2c;
    --ivory: #fff8ea;
    --card-bg: rgba(250, 240, 220, 0.92);
    --card-ink: #3a2410;
    --card-muted: #6d5033;
    --serif: 'Cormorant Garamond', Garamond, 'Times New Roman', serif;
    --inscription: Cinzel, 'Trajan Pro', Georgia, serif;
    color-scheme: light dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --card-bg: rgba(38, 24, 11, 0.9); --card-ink: #f6e6c6; --card-muted: #cdb38a; }
  }
  :root[data-theme="dark"] { --card-bg: rgba(38, 24, 11, 0.9); --card-ink: #f6e6c6; --card-muted: #cdb38a; }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { height: 100%; margin: 0; overflow: hidden; background: var(--walnut); color: var(--ivory); font-family: var(--serif); }

  #stage { position: fixed; inset: 0; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
  #stage.dragging { cursor: grabbing; }
  #stage.pointing:not(.dragging) { cursor: pointer; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity 1.2s ease, filter .5s ease; }
  body.ready #stage canvas { opacity: 1; }
  body.in-room #stage canvas { filter: blur(14px) brightness(.5); }

  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  #overlay .door { fill: transparent; pointer-events: all; }
  #overlay .dim { fill: rgba(28, 16, 5, .5); pointer-events: none; opacity: 0; transition: opacity .45s ease; }
  #overlay .glow { fill: rgba(255, 214, 150, .10); stroke: #f1cf8c; stroke-width: 2; pointer-events: none; opacity: 0; transition: opacity .35s ease;
    filter: drop-shadow(0 0 6px rgba(255, 206, 120, .9)) drop-shadow(0 0 22px rgba(255, 190, 90, .55)); mix-blend-mode: screen; }
  #overlay.has-active .dim, #overlay.has-active .glow { opacity: 1; }
  body.entering #overlay .dim, body.entering #overlay .glow { opacity: 0; }
  body.in-room #overlay { opacity: 0; }

  .masthead { position: fixed; top: calc(env(safe-area-inset-top, 0px) + clamp(14px, 3vh, 34px)); left: 0; right: 0; text-align: center; pointer-events: none;
    opacity: 0; transform: translateY(-6px); transition: opacity 1.4s ease .4s, transform 1.4s ease .4s; }
  body.ready .masthead { opacity: 1; transform: none; }
  body.in-room .masthead, body.entering .masthead { opacity: 0; transition-delay: 0s; }
  .masthead h1, .masthead p { margin: 0; line-height: 1.1; }
  .masthead [hidden] { display: none; }
  #overline { font-family: var(--serif); font-style: italic; font-size: clamp(18px, 1.9vw, 26px); color: #f7ecd6;
    text-shadow: 0 1px 8px rgba(10, 40, 90, .6); margin-bottom: .1em; }
  #title { font-family: var(--inscription); font-weight: 600; font-size: clamp(26px, 4.2vw, 58px); letter-spacing: .16em; padding-left: .16em;
    text-transform: uppercase; white-space: nowrap; color: var(--ivory); text-shadow: 0 1px 2px rgba(20, 50, 90, .55), 0 0 26px rgba(10, 40, 90, .45); }
  #subtitle { font-family: var(--inscription); font-weight: 600; font-size: clamp(16px, 1.8vw, 26px); letter-spacing: .35em; padding-left: .35em;
    text-transform: uppercase; margin-top: .25em; color: var(--gilt); text-shadow: 0 1px 2px rgba(20, 50, 90, .6), 0 0 18px rgba(10, 40, 90, .5); }

  #caption { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(14px, 3.5vh, 30px)); margin: 0; text-align: center; pointer-events: none;
    font-size: clamp(16px, 1.5vw, 20px); color: var(--ivory); text-shadow: 0 1px 3px rgba(30, 15, 3, .9), 0 0 18px rgba(30, 15, 3, .7);
    opacity: 0; transition: opacity 1s ease 1s; }
  body.ready #caption { opacity: 1; }
  body.in-room #caption, body.entering #caption { opacity: 0; transition-delay: 0s; }

  .step { position: fixed; top: 50%; z-index: 3; width: 46px; height: 46px; margin-top: -23px; display: none; place-items: center; padding: 0;
    border-radius: 50%; border: 1px solid rgba(255, 231, 186, .75); background: rgba(43, 26, 12, .45); color: var(--ivory); cursor: pointer;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: 0; transition: opacity 1s ease 1.2s; }
  .step svg { width: 18px; height: 18px; }
  #prev { left: calc(env(safe-area-inset-left, 0px) + 12px); }
  #next { right: calc(env(safe-area-inset-right, 0px) + 12px); }
  .step:focus-visible { outline: 2px solid var(--gilt); outline-offset: 3px; }
  @media (max-width: 760px), (pointer: coarse) { .step { display: grid; } }
  body.ready .step { opacity: 1; }
  body.in-room .step, body.entering .step { opacity: 0; pointer-events: none; transition-delay: 0s; }
  #rooms-nav button { position: fixed; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; padding: 0; }

  #veil { position: fixed; inset: 0; background: #1c1005; opacity: 0; pointer-events: none; transition: opacity .38s ease; z-index: 5; }
  #veil.on { opacity: 1; }

  #room { position: fixed; inset: 0; z-index: 4; display: grid; place-items: center; padding: 24px; opacity: 0; transition: opacity .5s ease; }
  #room.shown { opacity: 1; }
  #room[hidden] { display: none; }
  #room-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  #room.with-video #room-video { display: block; }
  #room.with-video { place-items: end start; padding: clamp(18px, 5vw, 64px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(18px, 5vw, 56px)); }
  .room-card { position: relative; max-width: 34rem; width: 100%; padding: clamp(24px, 4vw, 44px); background: var(--card-bg); color: var(--card-ink);
    border: 1px solid rgba(216, 176, 103, .7); outline: 1px solid rgba(216, 176, 103, .35); outline-offset: 5px; border-radius: 2px;
    box-shadow: 0 30px 80px rgba(20, 10, 2, .45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .room-card h2 { margin: 0 0 .5em; font-family: var(--inscription); font-weight: 600; font-size: clamp(24px, 3vw, 36px); letter-spacing: .12em; line-height: 1.15; }
  .room-card p { margin: 0 0 1.6em; font-size: clamp(18px, 1.6vw, 21px); line-height: 1.5; color: var(--card-muted); }
  #back { font: 500 18px/1 var(--serif); color: var(--card-ink); background: transparent; border: 1px solid var(--gilt-deep); padding: 12px 22px; border-radius: 2px; cursor: pointer;
    transition: background .2s ease, color .2s ease; }
  #back:hover { background: var(--gilt-deep); color: var(--ivory); }
  #back:focus-visible, #rooms-nav button:focus-visible { outline: 2px solid var(--gilt); outline-offset: 3px; }

  #status { pointer-events: none; position: fixed; inset: auto 0 45% 0; margin: 0 auto; max-width: 30rem; padding: 0 24px; text-align: center; font-size: 20px; line-height: 1.5; color: var(--stone); transition: opacity .6s ease; }
  #status:empty::before { content: 'Opening the atrium…'; font-style: italic; opacity: .7; }
  body.ready #status:empty { opacity: 0; }

  /* ---------- Back to Digital Banker (GIA) ----------
     Explicit hard link, never history.back(), per the fixed back-chain of
     the connected Glonari screens. Styled in this page's own language
     (walnut glass pill, gilt hairline, serif caption) like the .step
     buttons. Hidden until the hall has appeared, and while a doorway is
     being entered or a room screen is open. */
  .back-link { position: fixed; z-index: 3;
    top: calc(env(safe-area-inset-top, 0px) + clamp(14px, 3vh, 34px)); left: calc(env(safe-area-inset-left, 0px) + clamp(14px, 2vw, 28px));
    display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px 9px 14px;
    border: 1px solid rgba(255, 231, 186, .75); border-radius: 999px; background: rgba(43, 26, 12, .45);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    font: 500 17px/1 var(--serif); letter-spacing: .06em; color: var(--ivory); text-decoration: none;
    opacity: 0; pointer-events: none; transition: opacity 1s ease 1s, background .2s ease, border-color .2s ease; }
  .back-link svg { width: 14px; height: 14px; }
  .back-link:hover { background: rgba(43, 26, 12, .7); border-color: var(--gilt); }
  .back-link:focus-visible { outline: 2px solid var(--gilt); outline-offset: 3px; }
  body.ready .back-link { opacity: 1; pointer-events: auto; }
  body.in-room .back-link, body.entering .back-link { opacity: 0; pointer-events: none; transition-delay: 0s; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01s !important; transition-delay: 0s !important; } }
</style>
</head>
<body>
  <div id="gia-entry-veil" aria-hidden="true"></div>
  <a class="back-link" href="../gia/index.html" aria-label="Back to Digital Banker"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M11.5 3 5.5 9l6 6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span>Back</span></a>
  <main id="stage" aria-label="The atrium. Drag to look around; choose a doorway to enter a room.">
    <svg id="overlay" aria-hidden="true"></svg>
  </main>

  <header class="masthead">
    <p id="overline"></p>
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </header>

  <p id="caption" aria-live="polite"></p>
  <nav id="rooms-nav" aria-label="Rooms"></nav>
  <button class="step" id="prev" type="button" aria-label="Previous doorway"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M11.5 3 5.5 9l6 6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
  <button class="step" id="next" type="button" aria-label="Next doorway"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="m6.5 3 6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
  <p id="status" role="status"></p>

  <section id="room" hidden aria-labelledby="room-title">
    <video id="room-video" muted loop playsinline preload="none"></video>
    <div class="room-card">
      <h2 id="room-title"></h2>
      <p id="room-text"></p>
      <button id="back" type="button">Back to the atrium</button>
    </div>
  </section>
  <div id="veil"></div>

  <script src="vendor/three.min.js"></script>
  <script src="atrium.js"></script>
  <script>
  /* Entry-veil control (see #gia-entry-veil in <head>). Waits for the
     atrium's own "scene is ready" signal: atrium.js adds body.ready only
     after the panorama has decoded, the Cinzel font is in and the WebGL
     scene is built. With GIA's prefetch this is normally already the case
     a frame or two after landing. If it takes longer than MAX_HOLD_MS (or
     atrium.js reports an error in #status), the veil lifts anyway and the
     page falls back to its own "Opening the atrium…" loader and canvas
     fade-in, rather than holding a dark screen. */
  (function () {
    var VEIL_OUT_MS = 250, MAX_HOLD_MS = 1200;
    var el = document.getElementById('gia-entry-veil');
    var status = document.getElementById('status');
    var root = document.documentElement;
    if (!el) { root.classList.remove('gia-entry'); return; }
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var done = false, observer = null, holdTimer = 0;
    function isReady() { return document.body.classList.contains('ready'); }
    function reveal() {
      if (done) return;
      done = true;
      if (observer) observer.disconnect();
      clearTimeout(holdTimer);
      // not ready yet: give the canvas its own fade-in back for when it is
      if (!isReady()) root.classList.remove('gia-entry');
      el.style.transition = reduceMotion ? 'none' : 'opacity ' + VEIL_OUT_MS + 'ms ease-out';
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); root.classList.remove('gia-entry'); }, reduceMotion ? 0 : VEIL_OUT_MS);
    }
    function check() {
      if (isReady() || (status && status.textContent.trim())) {
        // one frame so the first rendered frame of the hall is on screen under the veil
        requestAnimationFrame(reveal);
        return true;
      }
      return false;
    }
    if (check()) return;
    observer = new MutationObserver(check);
    observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });
    if (status) observer.observe(status, { childList: true, characterData: true, subtree: true });
    holdTimer = setTimeout(reveal, MAX_HOLD_MS);
  })();
  </script>
</body>
</html>
